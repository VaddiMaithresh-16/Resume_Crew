[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-crew"
version = "1.3.0"
description = "Resume_Crew — grounded, local-first resume-to-job-description analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "crewai[google-genai]==1.15.11",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "gradio>=4.44.0",
  "matplotlib>=3.8.0",
  "fpdf2>=2.8.0",
  "pyngrok>=7.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
resume-crew = "resume_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
